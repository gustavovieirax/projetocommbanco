<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <a href="clientes.html" class="text-light">Clientes</a>
        <a href="senioridade.html" class="text-light">Senioridade</a>
        <a href="estilos.html" class="text-light">Estilos</a>
        <a href="tatuadores.html" class="text-light">Tatuadores</a>
        <a href="agendamentos.html" class="text-light">Agendamentos</a>
        <button type="button" onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-3">
    <h1>Agendamentos</h1>
    <p class="text-muted-custom mb-4">Organize as próximas sessões e acompanhe os atendimentos do estúdio.</p>
    <section class="form-card mb-4">
      <h2 class="h5 mb-3">Cadastrar agendamento</h2>
      <form id="form-agendamento" class="row g-2">
        <div class="col-md-3">
          <label for="idcliente" class="form-label">Cliente</label>
          <select id="idcliente" class="form-select" required><option value="">Cliente...</option></select>
        </div>
        <div class="col-md-3">
          <label for="idtatuador" class="form-label">Tatuador</label>
          <select id="idtatuador" class="form-select" required><option value="">Tatuador...</option></select>
        </div>
        <div class="col-md-2">
          <label for="dataagendamento" class="form-label">Data</label>
          <input type="date" id="dataagendamento" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label for="horaagendamento" class="form-label">Hora</label>
          <input type="time" id="horaagendamento" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label for="valortatuagem" class="form-label">Valor (R$)</label>
          <input type="number" id="valortatuagem" class="form-control" placeholder="0,00" step="0.01" min="0">
        </div>
        <div class="col-12">
          <label for="descricaotatuagem" class="form-label">Descrição da tatuagem</label>
          <textarea id="descricaotatuagem" class="form-control" rows="2" placeholder="Descreva a ideia da sessão"></textarea>
        </div>
        <div class="col-md-3">
          <label for="status" class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="pendente">Pendente</option>
            <option value="confirmado">Confirmado</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button id="btn-submit-agendamento" type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </div>
      </form>
      <div id="mensagemAgendamentos" class="alert mt-3 mb-0" role="status" aria-live="polite"></div>
    </section>
    <section class="table-card">
      <h2 class="h5 mb-3">Agendamentos cadastrados</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr><th>ID</th><th>Cliente</th><th>Tatuador</th><th>Data</th><th>Hora</th><th>Valor</th><th>Status</th></tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>
</body>
</html>
