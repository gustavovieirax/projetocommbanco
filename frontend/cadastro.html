<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo funcionário — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-shell">
  <main class="auth-card">
    <a class="navbar-brand text-dark" href="dashboard.html">Estúdio de Tatuagem</a>
    <h1 class="h2 mt-4 mb-2">Novo funcionário</h1>
    <p class="text-muted-custom mb-4">Crie o acesso de uma pessoa da equipe.</p>
    <form id="form-cadastro">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control" autocomplete="name" required minlength="2">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100">Cadastrar funcionário</button>
    </form>
    <div id="mensagemCadastro" class="alert mt-3 mb-0" role="status" aria-live="polite"></div>
    <p class="mt-4 mb-0"><a href="dashboard.html">Voltar ao painel</a></p>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
