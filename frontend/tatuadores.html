<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <a href="clientes.html" class="text-light">Clientes</a>
        <a href="senioridade.html" class="text-light">Senioridade</a>
        <a href="estilos.html" class="text-light">Estilos</a>
        <a href="tatuadores.html" class="text-light">Tatuadores</a>
        <a href="agendamentos.html" class="text-light">Agendamentos</a>
        <button type="button" onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-3">
    <h1>Tatuadores</h1>
    <p class="text-muted-custom mb-4">Cadastre a equipe e associe cada tatuador à sua senioridade.</p>
    <section class="form-card mb-4">
      <h2 class="h5 mb-3">Cadastrar tatuador</h2>
      <form id="form-tatuador" class="row g-2">
        <div class="col-md-3">
          <label for="nometatuador" class="form-label">Nome</label>
          <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required minlength="2">
        </div>
        <div class="col-md-2">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" id="cpf" class="form-control" placeholder="Só números" maxlength="11" minlength="11" required>
        </div>
        <div class="col-md-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="E-mail">
        </div>
        <div class="col-md-2">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="tel" id="telefone" class="form-control" placeholder="Telefone">
        </div>
        <div class="col-md-2">
          <label for="datacontratacao" class="form-label">Contratação</label>
          <input type="date" id="datacontratacao" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="idsenioridade" class="form-label">Senioridade</label>
          <select id="idsenioridade" class="form-select" required>
            <option value="">Senioridade...</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </div>
      </form>
      <div id="mensagemTatuadores" class="alert mt-3 mb-0" role="status" aria-live="polite"></div>
    </section>
    <section class="table-card">
      <h2 class="h5 mb-3">Tatuadores cadastrados</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Senioridade</th></tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>
</body>
</html>
