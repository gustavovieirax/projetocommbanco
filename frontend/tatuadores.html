<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatuadores</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h2>Tatuadores</h2>
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </header>

    <section class="panel">
      <form id="formTatuador">
        <div>
          <label for="nometatuador">Nome</label>
          <input id="nometatuador" placeholder="Nome do tatuador" required />
        </div>
        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" placeholder="CPF" maxlength="11" required />
        </div>
        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="E-mail" />
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input id="telefone" placeholder="Telefone" />
        </div>
        <div>
          <label for="datacontratacao">Data de contratação</label>
          <input id="datacontratacao" type="date" />
        </div>
        <div>
          <label for="idsenioridade">Senioridade</label>
          <select id="idsenioridade"></select>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button type="submit">Salvar tatuador</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Senioridade</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="listaTatuadores"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    async function carregarSenioridades() {
      const resposta = await fetch('http://localhost:8000/senioridades');
      const senioridades = await resposta.json();
      const select = document.getElementById('idsenioridade');
      select.innerHTML = senioridades.map(item => `
        <option value="${item.idsenioridade}">${item.nome}</option>
      `).join('');
    }

    async function carregarTatuadores() {
      const resposta = await fetch('http://localhost:8000/tatuadores');
      const tatuadores = await resposta.json();
      const tbody = document.getElementById('listaTatuadores');
      tbody.innerHTML = tatuadores.map(item => `
        <tr>
          <td>${item.idtatuador}</td>
          <td>${item.nometatuador}</td>
          <td>${item.senioridade || '-'}</td>
          <td>${item.email || '-'}</td>
        </tr>
      `).join('');
    }

    document.getElementById('formTatuador').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const payload = {
        nometatuador: document.getElementById('nometatuador').value,
        cpf: document.getElementById('cpf').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        datacontratacao: document.getElementById('datacontratacao').value,
        idsenioridade: Number(document.getElementById('idsenioridade').value)
      };

      const resposta = await fetch('http://localhost:8000/tatuadores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resposta.ok) {
        document.getElementById('formTatuador').reset();
        carregarTatuadores();
      } else {
        const erro = await resposta.json();
        alert('Erro: ' + (erro.detail || 'Não foi possível salvar o tatuador.'));
      }
    });

    carregarSenioridades();
    carregarTatuadores();
  </script>
</body>
</html>
