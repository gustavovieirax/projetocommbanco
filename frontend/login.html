<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-shell">
  <main class="auth-card">
    <a class="navbar-brand text-dark" href="index.html">Estúdio de Tatuagem</a>
    <h1 class="h2 mt-4 mb-2">Entrar</h1>
    <p class="text-muted-custom mb-4">Acesse o painel do estúdio.</p>
    <form id="form-login">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <div id="mensagemLogin" class="alert mt-3 mb-0" role="status" aria-live="polite"></div>
    <p class="mt-4 mb-0"><a href="index.html">Voltar ao início</a></p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
