<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h2>Clientes</h2>
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </header>

    <section class="panel">
      <form id="formCliente">
        <div>
          <label for="nome">Nome</label>
          <input id="nome" placeholder="Nome" required />
        </div>
        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" placeholder="CPF" maxlength="11" required />
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input id="telefone" placeholder="Telefone" />
        </div>
        <div>
          <label for="datacadastro">Data de cadastro</label>
          <input id="datacadastro" type="date" />
        </div>
        <div>
          <label for="cidade">Cidade</label>
          <input id="cidade" placeholder="Cidade" />
        </div>
        <div>
          <label for="uf">UF</label>
          <input id="uf" placeholder="UF" maxlength="2" />
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button type="submit">Salvar cliente</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Cidade</th>
              <th>UF</th>
            </tr>
          </thead>
          <tbody id="listaClientes"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    async function carregarClientes() {
      const resposta = await fetch('http://localhost:8000/clientes');
      const clientes = await resposta.json();
      const tbody = document.getElementById('listaClientes');
      tbody.innerHTML = clientes.map(cliente => `
        <tr>
          <td>${cliente.idcliente}</td>
          <td>${cliente.nome}</td>
          <td>${cliente.cpf}</td>
          <td>${cliente.cidade || '-'}</td>
          <td>${cliente.uf || '-'}</td>
        </tr>
      `).join('');
    }

    document.getElementById('formCliente').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const payload = {
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value,
        telefone: document.getElementById('telefone').value,
        datacadastro: document.getElementById('datacadastro').value,
        cidade: document.getElementById('cidade').value,
        uf: document.getElementById('uf').value
      };

      const resposta = await fetch('http://localhost:8000/clientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resposta.ok) {
        document.getElementById('formCliente').reset();
        carregarClientes();
      } else {
        const erro = await resposta.json();
        alert('Erro: ' + (erro.detail || 'Não foi possível salvar o cliente.'));
      }
    });

    carregarClientes();
  </script>
</body>
</html>
